<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, Segoe UI, sans-serif" font-size="13">
  <rect width="900" height="420" fill="#fcfcfb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
  </defs>
  <!-- Browser -->
  <rect x="20" y="40" width="170" height="90" rx="10" fill="#cde2fb" stroke="#2a78d6"/>
  <text x="105" y="70" text-anchor="middle" font-weight="600" fill="#0b0b0b">React UI</text>
  <text x="105" y="90" text-anchor="middle" fill="#52514e">13 pages · React Query</text>
  <text x="105" y="108" text-anchor="middle" fill="#52514e">Recharts · Tailwind</text>
  <!-- API -->
  <rect x="250" y="40" width="190" height="90" rx="10" fill="#ffffff" stroke="#52514e"/>
  <text x="345" y="70" text-anchor="middle" font-weight="600" fill="#0b0b0b">FastAPI /api</text>
  <text x="345" y="90" text-anchor="middle" fill="#52514e">Pydantic schemas</text>
  <text x="345" y="108" text-anchor="middle" fill="#52514e">API key · CORS · errors</text>
  <line x1="190" y1="85" x2="248" y2="85" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Services -->
  <rect x="500" y="20" width="380" height="250" rx="10" fill="#f0efec" stroke="#c3c2b7"/>
  <text x="690" y="42" text-anchor="middle" font-weight="600" fill="#0b0b0b">Services (business logic)</text>
  <g fill="#ffffff" stroke="#c3c2b7">
    <rect x="515" y="55" width="110" height="34" rx="6"/><rect x="635" y="55" width="110" height="34" rx="6"/><rect x="755" y="55" width="110" height="34" rx="6"/>
    <rect x="515" y="97" width="110" height="34" rx="6"/><rect x="635" y="97" width="110" height="34" rx="6"/><rect x="755" y="97" width="110" height="34" rx="6"/>
    <rect x="515" y="139" width="110" height="34" rx="6"/><rect x="635" y="139" width="110" height="34" rx="6"/><rect x="755" y="139" width="110" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#0b0b0b">
    <text x="570" y="77">scanner</text><text x="690" y="77">extractors</text><text x="810" y="77">duplicates</text>
    <text x="570" y="119">semantic</text><text x="690" y="119">consolidation</text><text x="810" y="119">compression</text>
    <text x="570" y="161">ML service</text><text x="690" y="161">cost engine</text><text x="810" y="161">forecasting</text>
  </g>
  <rect x="515" y="185" width="350" height="34" rx="6" fill="#cde2fb" stroke="#2a78d6"/>
  <text x="690" y="207" text-anchor="middle" font-weight="600" fill="#0b0b0b">orchestrator: plans → approve → dry-run → execute</text>
  <rect x="515" y="227" width="170" height="34" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="600" y="249" text-anchor="middle" fill="#0b0b0b">audit log</text>
  <rect x="695" y="227" width="170" height="34" rx="6" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="780" y="249" text-anchor="middle" fill="#0b0b0b">s3_service (boto3)</text>
  <line x1="440" y1="85" x2="498" y2="85" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Stores -->
  <rect x="250" y="310" width="190" height="80" rx="10" fill="#ffffff" stroke="#52514e"/>
  <text x="345" y="340" text-anchor="middle" font-weight="600" fill="#0b0b0b">PostgreSQL / SQLite</text>
  <text x="345" y="360" text-anchor="middle" fill="#52514e">metadata · embeddings · plans</text>
  <text x="345" y="378" text-anchor="middle" fill="#52514e">Alembic migrations</text>
  <rect x="500" y="310" width="170" height="80" rx="10" fill="#ffffff" stroke="#52514e"/>
  <text x="585" y="340" text-anchor="middle" font-weight="600" fill="#0b0b0b">Authorised folders</text>
  <text x="585" y="360" text-anchor="middle" fill="#52514e">read-only analysis</text>
  <text x="585" y="378" text-anchor="middle" fill="#52514e">outputs/ for copies</text>
  <rect x="710" y="310" width="170" height="80" rx="10" fill="#ffffff" stroke="#52514e"/>
  <text x="795" y="340" text-anchor="middle" font-weight="600" fill="#0b0b0b">Amazon S3</text>
  <text x="795" y="360" text-anchor="middle" fill="#52514e">optional · read-only</text>
  <text x="795" y="378" text-anchor="middle" fill="#52514e">gated class changes</text>
  <line x1="560" y1="270" x2="400" y2="308" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="585" y1="270" x2="585" y2="308" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="780" y1="261" x2="790" y2="308" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="20" y="300" fill="#52514e">Embeddings: Sentence-Transformers</text>
  <text x="20" y="318" fill="#52514e">(all-MiniLM-L6-v2, CPU, lazy-loaded)</text>
  <text x="20" y="336" fill="#52514e">ML: scikit-learn (LR, RF)</text>
</svg>
